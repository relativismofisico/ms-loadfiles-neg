spring:
  datasource:
    url: "jdbc:mysql://${DB_HOST}:3306/${DB_NAME}?useSSL=true&serverTimezone=UTC&requireSSL=true&useUnicode=true&characterEncoding=UTF-8"
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

server:
  port: 8081

app:
  frontend:
    registro-empresa-base-url: ${REGISTRO_EMPRESA_FRONTEND_URL}
    firmar-documentos-base-url: ${FIRMAR_DOCUMENTOS_FRONTEND_URL}

logging:
  level:
    org.hibernate.SQL: error
    com.loadfilesservice: warn
    org.springframework.security: warn

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

security:
  jwt:
    secret: ${JWT_SECRET}
  rol:
    todos:
      - ADMINISTRADOR
      - EMPRESA
      - OPERARIO
      - FONDEADOR
    carga:
      - ADMINISTRADOR
      - EMPRESA
      - OPERARIO
    revision:
      - ADMINISTRADOR
      - OPERARIO
      - FONDEADOR
    firma-subida:
      - ADMINISTRADOR
      - OPERARIO
    firma-guardado:
      - ADMINISTRADOR
      - EMPRESA