spring:
  datasource:
    url: "jdbc:mysql://${DB_HOST}:3306/${DB_NAME}?useSSL=true&serverTimezone=UTC"
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

server:
  port: 8081

logging:
  level:
    org.hibernate.SQL: warn
    com.loadfilesservice: info
    org.springframework.security: info

security:
  jwt:
    secret: ${JWT_SECRET}
  rol:
    todos:
      - ADMINISTRADOR
      - EMPRESA
      - OPERARIO
      - FONDEADOR
    carga:
      - ADMINISTRADOR
      - EMPRESA
      - OPERARIO
    revision:
      - ADMINISTRADOR
      - OPERARIO
      - FONDEADOR
    firma-subida:
      - ADMINISTRADOR
      - OPERARIO
    firma-guardado:
      - ADMINISTRADOR
      - EMPRESA