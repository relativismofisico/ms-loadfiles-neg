plugins {
    id 'pmd'
    id 'java'
    id 'groovy'
    id 'jacoco'
    id 'checkstyle'
    id 'org.sonarqube' version '5.1.0.4882'
    id 'com.github.spotbugs' version '6.0.26'
    id 'org.springframework.boot' version '3.3.4'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = "com.loadfiles"
version = "1.0.0"
description = "Load files microservice for karonte"

java {
    sourceCompatibility = '17'
}

jacoco {
    toolVersion = "0.8.11"
}

configurations {
    automatedTestImplementation.extendsFrom testImplementation
    automatedTestRuntimeOnly.extendsFrom testRuntimeOnly
    architectureTestImplementation.extendsFrom testImplementation
    architectureTestRuntimeOnly.extendsFrom testRuntimeOnly
}

repositories {
    mavenCentral()
}

apply from: "${rootProject.projectDir}/test.gradle"

dependencies {
    // Spring Boot starters
    implementation("org.springframework.boot:spring-boot-starter-actuator")
    implementation("org.springframework.boot:spring-boot-starter-data-jpa")
    implementation("org.springframework.boot:spring-boot-starter-web")
    implementation("org.springframework.boot:spring-boot-starter-validation")
    implementation("org.springframework.boot:spring-boot-starter-sec" +
            "urity")

    // JWT (misma librería que ms-security)
    implementation("io.jsonwebtoken:jjwt-api:0.12.3")
    runtimeOnly("io.jsonwebtoken:jjwt-impl:0.12.3")
    runtimeOnly("io.jsonwebtoken:jjwt-jackson:0.12.3")

    // Dev tools (only active during development, excluded from bootJar)
    developmentOnly("org.springframework.boot:spring-boot-devtools")

    // Database drivers
    runtimeOnly("com.microsoft.sqlserver:mssql-jdbc")
    runtimeOnly("com.mysql:mysql-connector-j")

    // Utilities
    implementation("com.google.code.gson:gson:2.10.1")
    implementation("org.modelmapper:modelmapper:2.4.4")

    // Lombok
    compileOnly("org.projectlombok:lombok")
    annotationProcessor("org.projectlombok:lombok")

    // Testing
    testImplementation("org.springframework.boot:spring-boot-starter-test")
    // Spock Framework
    testImplementation("org.apache.groovy:groovy")
    testImplementation("org.spockframework:spock-core:2.3-groovy-4.0")
    testImplementation("org.spockframework:spock-spring:2.3-groovy-4.0")
    architectureTestImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'

    // Karate Framework — pruebas funcionales/aceptación
    automatedTestImplementation 'com.intuit.karate:karate-junit5:1.4.0'
    automatedTestImplementation 'com.intuit.karate:karate-core:1.4.0'
    automatedTestImplementation("io.jsonwebtoken:jjwt-api:0.12.3")
    automatedTestImplementation("io.jsonwebtoken:jjwt-impl:0.12.3")
    automatedTestImplementation("io.jsonwebtoken:jjwt-jackson:0.12.3")
    automatedTestImplementation("net.masterthought:cucumber-reporting:5.8.4")
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport // siempre genera reporte después de los tests

}

sonarqube {
    properties {
        property "sonar.projectKey", "ms-loadfiles-neg"
        property "sonar.projectName", "ms-loadfiles-neg"
        property "sonar.projectVersion", version
        property "sonar.sources", "src/main/java"
        property "sonar.tests", "src/test/java,src/automated-test/java"
        property "sonar.java.source", "17"
        property "sonar.sourceEncoding", "UTF-8"
        property "sonar.coverage.jacoco.xmlReportPaths",
                "build/reports/jacoco/test/jacocoTestReport.xml"
        property "sonar.java.checkstyle.reportPaths",
                "build/reports/checkstyle/main.xml"
        property "sonar.java.pmd.reportPaths",
                "build/reports/pmd/main.xml"
        property "sonar.java.spotbugs.reportPaths",
                "build/reports/spotbugs/main.xml"
        property "sonar.coverage.exclusions",
                "**/entity/**,**/dto/**,**/exceptions/ApiErrorResponse.java,**/LoadfilesApplication.java"
    }
}

apply from: "${rootProject.projectDir}/coverage.gradle"