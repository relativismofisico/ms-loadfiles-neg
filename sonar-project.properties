# ============================================================
# SonarQube project properties — ms-loadfiles-neg
# Compatible con SonarQube 9.x / 10.x y SonarCloud
# ============================================================

sonar.projectKey=ms-loadfiles-neg
sonar.projectName=ms-loadfiles-neg
sonar.projectVersion=1.0.0
sonar.description=Load files microservice for karonte

# Fuentes y tests
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=build/classes/java/main
sonar.java.test.binaries=build/classes/java/test

# Cobertura JaCoCo
sonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml

# Checkstyle
sonar.java.checkstyle.reportPaths=build/reports/checkstyle/main.xml

# Encoding
sonar.sourceEncoding=UTF-8

# Java version
sonar.java.source=17

# Exclusiones de cobertura (DTOs, configuración, entidades)
sonar.coverage.exclusions=\
  **/entity/**,\
  **/dto/**,\
  **/exceptions/ApiErrorResponse.java,\
  **/LoadfilesApplication.java

# Exclusiones de análisis
sonar.exclusions=\
  **/LoadfilesApplication.java

# PMD
sonar.java.pmd.reportPaths=build/reports/pmd/main.xml

# SpotBugs
sonar.java.spotbugs.reportPaths=build/reports/spotbugs/main.xml