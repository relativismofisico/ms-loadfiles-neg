variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  AMBIENTE_PIPE: ${CI_ENVIRONMENT_NAME:-dev}

stages:
  - functional-test

.karate-base:
  image: eclipse-temurin:17-jdk
  stage: functional-test
  before_script:
    - chmod +x gradlew
  script:
    - ./gradlew automatedTest
        -Pkarate.jwt.secret="${KARATE_JWT_SECRET}"
        -Pkarate.base.url="${KARATE_BASE_URL}"
        -Pkarate.test.companyId="${KARATE_TEST_COMPANY_ID:-1}"
        -Pkarate.test.userId="${KARATE_TEST_USER_ID:-1}"
        -Pkarate.test.fileId="${KARATE_TEST_FILE_ID:-1}"
        -Pkarate.test.signedFileId="${KARATE_TEST_SIGNED_FILE_ID:-1}"
        -Pkarate.test.fileToSignId="${KARATE_TEST_FILE_TO_SIGN_ID:-1}"
        -Pkarate.test.companyName="${KARATE_TEST_COMPANY_NAME:-empresa-test}"
  artifacts:
    when: always
    reports:
      junit: build/test-results/automatedTest/**/*.xml
    paths:
      - build/reports/tests/automatedTest/
    expire_in: 7 days
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .gradle/

karate-smoke-dev:
  extends: .karate-base
  environment: dev
  variables:
    AMBIENTE_PIPE: dev
  only:
    - merge_requests
    - develop

karate-regression-qa:
  extends: .karate-base
  environment: qa
  variables:
    AMBIENTE_PIPE: qa
  only:
    - main
    - master

karate-prod-safe:
  extends: .karate-base
  environment: prod
  variables:
    AMBIENTE_PIPE: prod
  script:
    - ./gradlew automatedTest
        -Pkarate.env=prod
        -Pkarate.jwt.secret="${KARATE_JWT_SECRET}"
        -Pkarate.base.url="${KARATE_BASE_URL}"
  only:
    - tags
  when: manual