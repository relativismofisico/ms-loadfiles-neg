task automatedTest(type: Test) {

    description = 'Runs Karate acceptance tests'
    group = 'verification'

    testClassesDirs = sourceSets.automatedTest.output.classesDirs
    classpath = sourceSets.automatedTest.runtimeClasspath

    useJUnitPlatform()

    outputs.upToDateWhen { false }

    finalizedBy jacocoTestReport

    // ── Karate environment ────────────────────────────────────────────────────
    // Determina el ambiente: prioridad -Pkarate.env > AMBIENTE_PIPE > 'dev'
    def karateEnv = project.findProperty('karate.env')
            ?: System.getenv('AMBIENTE_PIPE')
            ?: 'dev'
    systemProperty 'karate.env', karateEnv

    // ── Credenciales y parámetros de prueba ───────────────────────────────────
    // Prioridad: karate.properties (local, git-ignorado) → -Pkarate.xxx → env vars
    //
    // Opcion A (recomendada): crear karate.properties en la raiz del proyecto
    //   karate.admin.user=USUARIO
    //   karate.admin.pass=PASSWORD
    //
    // Opcion B: ./gradlew automatedTest -Pkarate.admin.user=XXX -Pkarate.admin.pass=XXX
    // Opcion C: ADMIN_USER=XXX ADMIN_PASS=XXX ./gradlew automatedTest
    def karatePropsFile = file('src/automated-test/resources/karate.properties')
    if (karatePropsFile.exists()) {
        def karateProps = new Properties()
        karateProps.load(karatePropsFile.newInputStream())
        karateProps.each { k, v ->
            if (k != null && k.toString().startsWith('karate.') && v != null && !v.toString().isEmpty()) {
                systemProperty k.toString(), v.toString()
            }
        }
    }

    // Las propiedades -Pkarate.xxx de línea de comandos tienen mayor prioridad
    project.properties.each { k, v ->
        if (k != null && k.toString().startsWith('karate.') && v != null) {
            systemProperty k.toString(), v.toString()
        }
    }
}

test {
    jvmArgs "-Xms128m", "-Xmx512m", "-XX:+DisableExplicitGC"
