# ============================================================
# AMBIENTE: PRODUCCIÓN
# ms-loadfiles-neg Performance Tests
# RESTRICCIÓN: Solo endpoints GET y POST read-only permitidos.
# POST de escritura (upload, save, sign) BLOQUEADOS por prod.safe.only=true
# Uso: jmeter -n -t plans/ms-loadfiles-master.jmx -p config/prod.properties -JAMBIENTE_PIPE=prod
# ============================================================

# --- Servidor ---
host=prod-loadfiles.karonte.com
port=443
protocol=https
context.path=/load

# --- JWT (actualizar secret con el de application-prod.yml — NUNCA hardcodear en repo) ---
jwt.secret=CAMBIAR_POR_SECRET_PRODUCCION_BASE64
jwt.rol=ADMINISTRADOR
jwt.subject=jmeter-perf-prod-readonly

# --- Ambiente ---
ambiente=prod
# CRÍTICO: true bloquea todos los endpoints de escritura (POST con archivo)
prod.safe.only=true

# --- Datos de prueba (IDs reales de producción — actualizar antes de ejecutar) ---
data.dir=external-test/jmeter/data/prod
company.name=empresa_prod
ip.load=10.0.1.50
file.type.id=1

# ── Perfil 1: Smoke (1 hilo) — ÚNICO PERMITIDO EN PROD ──
profile1.threads=1
profile1.rampup=5
profile1.loops=1
profile1.duration=0
profile1.scheduler=false
profile1.throughput=5

# ── Perfil 2: Carga básica (10 hilos) — Usar con precaución ──
profile2.threads=10
profile2.rampup=60
profile2.loops=-1
profile2.duration=180
profile2.scheduler=true
profile2.throughput=10

# ── Perfil 3: Carga concurrente (100 hilos) — NO EJECUTAR EN PROD SIN APROBACIÓN ──
profile3.threads=20
profile3.rampup=120
profile3.loops=-1
profile3.duration=300
profile3.scheduler=true
profile3.throughput=20

# --- SLAs (ms) — más estrictos en producción ---
sla.read.ms=1000
sla.read.pdf.ms=3000
sla.write.ms=3000
sla.upload.ms=10000
sla.sign.ms=10000

# --- Timeouts de conexión ---
timeout.connect=10000
timeout.response=60000

# --- Parámetros generales ---
file.type.name=REGISTRO