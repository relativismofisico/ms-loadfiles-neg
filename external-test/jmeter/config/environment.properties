# ============================================================
# ARCHIVO MAESTRO DE CONFIGURACIÓN DE AMBIENTES
# ms-loadfiles-neg — Apache JMeter Performance Suite
# ============================================================
# Selección de ambiente via variable de entorno:
#   Windows: set AMBIENTE_PIPE=dev  && run-tests.ps1
#   Linux:   AMBIENTE_PIPE=qa ./scripts/run-tests.sh
#
# O directamente:
#   jmeter -n -t plans/ms-loadfiles-master.jmx \
#          -JAMBIENTE_PIPE=dev \
#          -p config/dev.properties \
#          -l results/result.jtl \
#          -e -o reports/run-YYYYMMDD-HHMM
# ============================================================

# ── Ambientes disponibles ──
# dev   → localhost:8081   (desarrollo local)
# qa    → qa-loadfiles.*  (ambiente QA/testing)
# prod  → prod-loadfiles.* (producción — solo lectura)

# ── Archivos de propiedades por ambiente ──
# config/dev.properties
# config/qa.properties
# config/prod.properties

# ── Estructura de datos de prueba ──
# data/dev/  → IDs y archivos para DEV
# data/qa/   → IDs y archivos para QA
# data/prod/ → IDs read-only para PROD

# ── Seguridad en producción ──
# prod.safe.only=true bloquea:
#   - E01 POST /api/companyfile/upload        (escritura archivo empresa)
#   - E09 POST /filesign/uploadsignedpdf      (subida PDF firmado)
#   - E10 POST /signs/save                    (guardar firma digital)
# Endpoints siempre permitidos en prod (GET y POST read-only):
#   - E02 POST /api/companyfile/upload/file/{id}
#   - E03 GET  /api/listofcompanyfiles/{id}
#   - E04 POST /api/companyfilepdf
#   - E05 GET  /filessigned/listofcompanysignedfiles/{id}
#   - E06 POST /filessigned/companyfilesignedpdf/{companyName}
#   - E07 GET  /filesign/filestosignregistry
#   - E08 POST /filesign/pdftosign
#   - E11 GET  /signs/company/{companyId}
#   - E12 GET  /signs/user/{userId}

# ── Grupos de roles por endpoint ──
# todos:          ADMINISTRADOR, EMPRESA, OPERARIO, FONDEADOR
# carga:          ADMINISTRADOR, EMPRESA, OPERARIO
# revision:       ADMINISTRADOR, OPERARIO, FONDEADOR
# firma-subida:   ADMINISTRADOR, OPERARIO
# firma-guardado: ADMINISTRADOR, EMPRESA
#
# Rol usado en pruebas: ADMINISTRADOR (acceso total)