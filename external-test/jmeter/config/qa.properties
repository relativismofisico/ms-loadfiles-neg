# ============================================================
# AMBIENTE: QA
# ms-loadfiles-neg Performance Tests
# Uso: jmeter -n -t plans/ms-loadfiles-master.jmx -p config/qa.properties -JAMBIENTE_PIPE=qa
# ============================================================

# --- Servidor ---
host=qa-loadfiles.karonte.internal
port=8081
protocol=http
context.path=/load

# --- JWT (actualizar secret con el de application-qa.yml) ---
jwt.secret=CAMBIAR_POR_SECRET_QA_BASE64
jwt.rol=ADMINISTRADOR
jwt.subject=jmeter-perf-qa

# --- Ambiente ---
ambiente=qa
prod.safe.only=false

# --- Datos de prueba ---
data.dir=external-test/jmeter/data/qa
company.name=empresa_test_qa
ip.load=10.0.0.100
file.type.id=10

# ── Perfil 1: Smoke (1 hilo) ──
profile1.threads=1
profile1.rampup=1
profile1.loops=1
profile1.duration=0
profile1.scheduler=false
profile1.throughput=100

# ── Perfil 2: Carga básica (10 hilos) ──
profile2.threads=10
profile2.rampup=30
profile2.loops=-1
profile2.duration=300
profile2.scheduler=true
profile2.throughput=30

# ── Perfil 3: Carga concurrente (100 hilos) ──
profile3.threads=100
profile3.rampup=120
profile3.loops=-1
profile3.duration=600
profile3.scheduler=true
profile3.throughput=100

# --- SLAs (ms) ---
sla.read.ms=1500
sla.read.pdf.ms=4000
sla.write.ms=4000
sla.upload.ms=12000
sla.sign.ms=12000

# --- Timeouts de conexión ---
timeout.connect=5000
timeout.response=30000

# --- Parámetros generales ---
file.type.name=REGISTRO