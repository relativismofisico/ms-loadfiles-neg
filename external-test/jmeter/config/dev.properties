# ============================================================
# AMBIENTE: DESARROLLO (DEV)
# ms-loadfiles-neg Performance Tests
# Data alineada con src/automated-test/resources/karate.properties
# Uso: jmeter -n -t plans/ms-loadfiles-master.jmx -p config/dev.properties -JAMBIENTE_PIPE=dev
# ============================================================

# --- Servidor (igual que karate.properties: karate.base.url=http://localhost:8081/load) ---
host=localhost
port=8081
protocol=http
context.path=/load

# --- JWT (mismo secret que karate.properties: karate.jwt.secret) ---
jwt.secret=AF84F1FGllNpNnLG055fdg5hGHJK4KGG5VH5TR5J05JFGGDFDGXVV545J4505G666JFGF2mMY95y
jwt.rol=ADMINISTRADOR
jwt.subject=jmeter-perf-dev

# --- Ambiente ---
ambiente=dev
prod.safe.only=false

# --- Archivos de prueba (reutilizar los mismos de Karate) ---
testfiles.dir=src/automated-test/resources/testfiles

# --- Datos de prueba (idénticos a karate.properties) ---
data.dir=external-test/jmeter/data/dev
company.name=empresa-test
ip.load=192.168.1.100
file.type.id=10
file.type.name=REGISTRO
file.type.description=Registro

# ── Perfil 1: Smoke (1 hilo) ──
profile1.threads=1
profile1.rampup=1
profile1.loops=1
profile1.duration=0
profile1.scheduler=false
profile1.throughput=100

# ── Perfil 2: Carga básica (10 hilos) ──
profile2.threads=10
profile2.rampup=30
profile2.loops=-1
profile2.duration=300
profile2.scheduler=true
profile2.throughput=30

# ── Perfil 3: Carga concurrente (100 hilos) ──
profile3.threads=100
profile3.rampup=120
profile3.loops=-1
profile3.duration=600
profile3.scheduler=true
profile3.throughput=100

# --- SLAs (ms) ---
sla.read.ms=2000
sla.read.pdf.ms=5000
sla.write.ms=5000
sla.upload.ms=15000
sla.sign.ms=15000

# --- Timeouts de conexión ---
timeout.connect=10000
timeout.response=30000

# --- HTML Report Generator (requerido por JMeter 5.6+) ---
jmeter.reportgenerator.apdex_satisfied_threshold=500
jmeter.reportgenerator.apdex_tolerated_threshold=1500
jmeter.reportgenerator.overall_granularity=60000