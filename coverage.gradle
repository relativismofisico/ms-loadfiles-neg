def jacocoExcludes = [
    '**/loadfiles/domain/**',
    '**/*DTORequest.class',
    '**/*DTOResponse.class',
    '**/LoadfilesApplication.class',
    '**/config/SecurityConfig.class',
    '**/config/SecurityProperties*.class',
    '**/application/ConstantVariables.class',
]

jacocoTestReport {
    dependsOn test // primero ejecuta los tests
    reports {
        xml.required = true
        csv.required = false
        html.required = true // genera reporte navegable
        html.outputLocation = layout.buildDirectory.dir('jacocoHtml')
    }
    afterEvaluate {
        classDirectories.setFrom(
                files(classDirectories.files.collect {
                    fileTree(dir: it, exclude: jacocoExcludes)
                })
        )
    }
}

jacocoTestCoverageVerification {
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: jacocoExcludes)
        }))
    }
    violationRules {
        rule {
            enabled = true
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.85
            }
        }
        rule {
            enabled = true
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.80
            }
        }

    }
}
jacocoTestReport {
    dependsOn test
}